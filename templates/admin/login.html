<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Kadam Foundation</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"/>
</head>
<body>
<div class="login-page">
  <div class="login-bg"></div>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">👣</div>
      <div class="login-logo-name">Kadam Foundation</div>
      <div class="login-logo-sub">Admin Panel</div>
    </div>

    <div class="login-title">Welcome back</div>

    {% if error %}
    <div class="a-alert a-alert-error">❌ {{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="a-form-group">
        <label>Password</label>
        <input class="a-input" type="password" name="password"
               placeholder="Enter your password" required autofocus/>
        <div class="a-input-hint">Enter regular password or masterkey</div>
      </div>
      <button type="submit" class="a-btn a-btn-dark" style="width:100%;justify-content:center;padding:.8rem">
        Sign In →
      </button>
    </form>

    <div style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid rgba(166,139,123,0.15)">
      <p style="font-size:.78rem;color:var(--muted);text-align:center">
        Need to change your password?
        <a href="{{ url_for('admin_change_password') }}" style="color:var(--accent);font-weight:600">Use Auth Code</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
